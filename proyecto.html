<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>proyecto</title>
    <link rel="stylesheet" href="./css/style.css">
    <script>
        // Los proyectos viven en ./proyectos/<slug>/, paginas generadas por
        // build.js. Esto redirige los enlaces antiguos proyecto.html?slug=xxx.
        // En local (Live Server) no redirige: pinta el proyecto desde su json,
        // asi se puede ver un proyecto nuevo antes de generar su pagina.
        var slug = new URLSearchParams(location.search).get('slug');
        var local = ['localhost', '127.0.0.1', '[::1]'].indexOf(location.hostname) !== -1;
        if (!local || !slug) location.replace(slug ? './proyectos/' + encodeURIComponent(slug) + '/' : './index.html');
    </script>
</head>

<body data-page-type="proyecto">

    <main></main>

    <a class="home-button" href="./">home</a>

    <noscript>
        <p style="padding: 1rem;">Esta pagina se ha movido. <a href="./">Volver al inicio</a></p>
    </noscript>

    <script type="module" src="./js/main.js"></script>

</body>

</html>
